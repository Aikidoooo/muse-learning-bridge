app:
  name: "Muse Learning Bridge"
  version: "1.2.0"
  environment: "local"
  host: "127.0.0.1"
  port: 8765
  data_dir: "data"
  logs_dir: "logs"
  db_path: "data/muse_bridge.db"
  log_level: "INFO"

security:
  # 学校からAI利用が許可された教材のみ処理対象とする
  require_explicit_ai_approval: true
  # 通常の学校評価対象テストでの自動解答・提出を禁止する
  allow_auto_submit_only_for_permitted: true
  # 認証情報・Cookie等の混入を検出した場合に拒否する
  reject_credential_fields: true
  # 外部AI APIへの通信はHTTPS必須（localhostのみローカル検証用にhttpを許可）
  allow_http_for_localhost: true
  # 予算上限（USD）
  max_cost_per_job_usd: 0.50
  max_daily_cost_usd: 5.00
  # ユーザー許可なく有料APIを使用しない
  allow_paid_api: false
  # 無料枠（RPM/TPM/RPD）のローカル保護を有効化
  enforce_free_tier_limits: true
  # 1ジョブあたりの最大問題数
  max_questions_per_job: 100
  # ログ・レポートの個人情報マスキング
  mask_pii_in_logs_and_reports: true

retry:
  # 一時的なAPI通信エラーの最大再試行回数（無限リトライ禁止）
  max_attempts: 3
  base_delay_seconds: 1.0
  max_delay_seconds: 8.0
  max_retry_info_wait_seconds: 30.0
  timeout_seconds: 45.0

optimization:
  # SQLite問題キャッシュと部分結果の再利用
  enable_cache: true
  cache_ttl_seconds: 86400
  # AI不要処理（純粋算術・単一選択等）のローカル解決
  enable_local_solver: true
  # 同一問題データの重複送信防止
  enable_deduplication: true
  # コンパクトJSON＋圧縮プロンプト＋共通選択肢抽出
  enable_compact_prompt: true
  # 超短縮ワイヤキー＆最小出力形式によるAPIトークン極小化
  ultra_compact_wire: true
  minimal_output: true
  # 低思考で曖昧な設問のみ段階的再確認するカスケード制御
  cascade_escalation: true
  # 1リクエストあたりバッチ問題数・サイズ上限・並列数
  batch_size: 25
  max_batch_input_chars: 14000
  max_batch_images: 4
  max_concurrency: 3
  # 思考レベル最適化（auto / minimal / balanced / high）
  thinking_mode: "auto"

providers:
  default_provider: "gemini"
  gemini:
    enabled: true
    display_name: "Google Gemini API"
    default_model: "gemini-2.5-flash"
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    api_key_env: "GEMINI_API_KEY"
    models:
      - "gemini-2.5-flash"
      - "gemini-2.5-pro"
      - "gemini-2.5-flash-lite"
    input_cost_per_1m_usd: 0.15
    output_cost_per_1m_usd: 0.60
    billing_tier: "free"
    rpm_limit: 15
    tpm_limit: 250000
    rpd_limit: 1000
  deepseek:
    enabled: true
    display_name: "DeepSeek API"
    default_model: "deepseek-chat"
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    models:
      - "deepseek-chat"
      - "deepseek-reasoner"
    input_cost_per_1m_usd: 0.27
    output_cost_per_1m_usd: 1.10
    billing_tier: "free"
    rpm_limit: 30
    tpm_limit: 250000
    rpd_limit: 1000
  openai:
    enabled: true
    display_name: "OpenAI API"
    default_model: "gpt-4o-mini"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    models:
      - "gpt-4o-mini"
      - "gpt-4o"
      - "gpt-4.1-mini"
    input_cost_per_1m_usd: 0.15
    output_cost_per_1m_usd: 0.60
    billing_tier: "free"
    rpm_limit: 30
    tpm_limit: 200000
    rpd_limit: 1000
  anthropic:
    enabled: true
    display_name: "Anthropic API"
    default_model: "claude-3-5-haiku-latest"
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"
    models:
      - "claude-3-5-haiku-latest"
      - "claude-3-7-sonnet-latest"
    input_cost_per_1m_usd: 0.80
    output_cost_per_1m_usd: 4.00
    billing_tier: "free"
    rpm_limit: 30
    tpm_limit: 100000
    rpd_limit: 1000
  openai_compatible:
    enabled: true
    display_name: "OpenAI互換 API"
    default_model: "local-model"
    base_url: "http://localhost:11434/v1"
    base_url_env: "OPENAI_COMPAT_BASE_URL"
    api_key_env: "OPENAI_COMPAT_API_KEY"
    models:
      - "local-model"
    input_cost_per_1m_usd: 0.0
    output_cost_per_1m_usd: 0.0
    billing_tier: "free"
    rpm_limit: 60
    tpm_limit: 0
    rpd_limit: 0
